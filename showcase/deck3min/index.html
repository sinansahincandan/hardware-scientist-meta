<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hardware Scientist Deck</title>
<style>
  :root { --bg: #111418; --ink: #eef1f5; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Helvetica, Arial, sans-serif; }
  .stage { height: 100%; display: flex; align-items: center; justify-content: center; }
  img { max-width: 100vw; max-height: 100vh; display: block; }
  .bar { position: fixed; bottom: 10px; right: 16px; font-size: 14px; opacity: 0.6; }
</style></head>
<body>
<div class="stage"><img id="s" alt="slide"></div>
<div class="bar"><span id="n"></span> · ← → to move, F for full screen</div>
<script>
  const slides = ["01_problem", "02_loops", "03_whiteboard", "04_textgrad", "05_picture", "06_designs",
                  "07_vs_one_prompt", "08_open_weights", "09_works"];
  let i = 0;
  try { i = Math.min(slides.length - 1, Math.max(0, parseInt(location.hash.slice(1) || "1", 10) - 1)); } catch (e) {}
  function show() { document.getElementById("s").src = slides[i] + ".jpg";
    document.getElementById("n").textContent = (i + 1) + " / " + slides.length; location.hash = String(i + 1); }
  document.addEventListener("keydown", (e) => {
    if (["ArrowRight", "PageDown", " "].includes(e.key)) { i = Math.min(slides.length - 1, i + 1); show(); }
    if (["ArrowLeft", "PageUp"].includes(e.key)) { i = Math.max(0, i - 1); show(); }
    if (e.key === "f" || e.key === "F") { document.documentElement.requestFullscreen?.(); }
  });
  document.addEventListener("click", () => { i = (i + 1) % slides.length; show(); });
  show();
</script>
</body></html>
